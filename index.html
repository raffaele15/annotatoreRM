  .marchio { display: flex; align-items: flex-end; gap: 8px; margin: 0 0 10px; }
  .marchio img { height: 60px; width: auto; flex: none; }
  .marchio h1 { margin: 0 0 -1px; font: 600 27px/29px "Orbitron", var(--num); letter-spacing: .06em; text-transform: uppercase; }
  .marchio h1 > span { display: block; }
  .marchio h1 .rm { color: var(--tenue); display: flex; justify-content: space-between; align-items: center; }
  .marchio h1 .minuscolo { text-transform: none; }
  .marchio h1 .rombo { display: block; width: 8px; height: 8px; border: 2px solid currentColor; transform: rotate(45deg); margin-right: .06em; }
  h1 { font: 600 1.7rem/1.1 var(--num); margin: 0 0 4px; letter-spacing: .01em; }
  .sotto { color: var(--tenue); margin: 0 0 18px; font-size: .9rem; }
  .passi { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  button { font: 600 .95rem var(--corpo); border-radius: 4px; padding: 9px 14px; cursor: pointer;
           border: 1px solid var(--linea); background: var(--pannello); color: var(--testo); }
  button.primario { background: var(--accento); border-color: var(--accento); color: var(--accento-testo); }
  .passi { align-items: center; }
  .aiuto { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px;
           border: 1.5px solid var(--tenue); border-radius: 50%; color: var(--tenue); font: 600 .72rem var(--num); padding-top: 2px; cursor: help; user-select: none; }
  .aiuto:hover, .aiuto:focus-visible { border-color: var(--testo); color: var(--testo); outline: none; }
  .aiuto .fumetto { display: none; position: absolute; left: 0; top: calc(100% + 8px); z-index: 20; width: max-content; max-width: 340px;
           background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; padding: 10px 12px;
           color: var(--testo); font: 400 .88rem/1.6 var(--corpo); box-shadow: 0 6px 18px rgba(0,0,0,.4); cursor: default; }
  .aiuto:hover .fumetto, .aiuto:focus .fumetto { display: block; }
  button.fatto { background: #1E3A2A; border-color: #3F7A55; color: #A9DDBA; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accento); outline-offset: 2px; }
  button .n { font-family: var(--num); opacity: .7; margin-right: 6px; }
  #messaggio { min-height: 1.4em; margin: 0 0 12px; color: var(--tenue); }
  #messaggio.errore { color: var(--errore); }

  /* Vista: è l'elemento che si sposta nella finestra fluttuante */
  #vista { display: flex; flex-direction: column; background: #000; border: 1px solid var(--linea);
           border-radius: 6px; overflow: hidden; height: min(72vh, 760px); position: relative; }
  body.in-pip { height: 100vh; }
  body.in-pip #vista { height: 100vh; border: 0; border-radius: 0; }
  #tela { flex: 1; width: 100%; min-height: 0; display: block; cursor: crosshair; }
  #video { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 7px 10px;
           background: var(--pannello); border-top: 1px solid var(--linea); font-size: .82rem; }
  .barra label { display: inline-flex; align-items: center; gap: 6px; color: var(--tenue); white-space: nowrap; }
  .barra input[type=range] { width: 90px; accent-color: var(--accento); }
  .barra input[type=checkbox] { accent-color: var(--accento); }
  .barra button { padding: 3px 9px; font-size: .8rem; }
  #stato { font-family: var(--num); font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }
  #stato .ok { color: var(--ok); }
  #cursore { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 3px; font-size: .85rem;
             background: rgba(0,0,0,.72); color: #fff; pointer-events: none; display: none; }

  /* Ingranaggio e pannello delle opzioni (dentro la vista: si spostano nella finestra fluttuante) */
  #ingranaggio { position: absolute; top: 8px; right: 8px; z-index: 3; width: 34px; height: 34px; padding: 0;
                 font-size: 19px; line-height: 1; border-radius: 50%; background: rgba(23,32,36,.88); }

  #opzioni { position: absolute; top: 48px; right: 8px; z-index: 3; width: min(280px, calc(100% - 16px));
             max-height: calc(100% - 100px); overflow-y: auto; padding: 10px 12px; font-size: .85rem;
             background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.55); }
  #opzioni[hidden] { display: none; }
  #opzioni h2 { font: 600 .8rem var(--corpo); color: var(--tenue); margin: 12px 0 4px; padding-top: 10px; border-top: 1px solid var(--linea); }
  #opzioni h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .riga { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; cursor: pointer; }
  .riga small { color: var(--tenue); font-family: var(--num); }
  .passo { display: inline-flex; align-items: center; gap: 6px; }
  .passo button { width: 30px; height: 26px; padding: 0; font-size: .85rem; }
  .passo output { font-family: var(--num); min-width: 2.5ch; text-align: center; }
  .gruppo-riga { display: flex; align-items: center; gap: 2px; }
  .gruppo-riga .riga { flex: 1; }
  .freccia { flex: none; width: 22px; height: 22px; padding: 0; border: 0; background: none; color: var(--tenue);
             font-size: .7rem; line-height: 1; transition: transform .15s; }
  .freccia[aria-expanded=true] { transform: rotate(90deg); color: var(--testo); }
  .spazio-freccia { flex: none; width: 22px; }
  .figli { margin: 0 0 4px 24px; padding-left: 8px; border-left: 1px solid var(--linea); font-size: .8rem; }
  .figli[hidden] { display: none; }
  .figli .riga { padding: 2px 0; }
  .riga-tutti { padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--linea); font-weight: 600; }
  input.switch:indeterminate { background: var(--linea); }
  input.switch:indeterminate::after { transform: translateX(8px); background: var(--accento); }
  @media (prefers-reduced-motion: reduce) { .freccia, input.switch, input.switch::after { transition: none; } }
  .scelta { display: flex; gap: 6px; }
  .scelta button { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 8px;
                   font-size: .85rem; text-align: left; }
  .scelta button small { font-weight: 400; color: var(--tenue); font-size: .75rem; }
  .scelta button[aria-pressed=true] { background: var(--accento); border-color: var(--accento); color: var(--accento-testo); }
  .scelta button[aria-pressed=true] small { color: var(--accento-testo); opacity: .8; }
  input.switch { appearance: none; flex: none; margin: 0; width: 34px; height: 18px; border-radius: 9px; position: relative;
                 background: var(--linea); cursor: pointer; transition: background .15s; }
  input.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
                        background: var(--tenue); transition: transform .15s; }

  input.switch:checked::after { transform: translateX(16px); background: var(--accento-testo); }
</style>

<body>
<main>
  <div class="marchio"><img src="logo-marchio.png" alt=""><h1><span>Atlante</span><span class="rm"><span>RM</span><i class="rombo"></i><span class="minuscolo">Live</span></span></h1></div>

  <div class="passi">
    <button id="avvia" class="primario" disabled><span class="n">1</span>Avvia cattura</button>
    <button id="seleziona" disabled><span class="n">2</span>Seleziona riquadro</button>
    <button id="pip" disabled><span class="n">3</span>Finestra fluttuante</button>
    <span class="aiuto" tabindex="0" role="button" aria-label="Istruzioni" aria-describedby="aiuto-testo">?
      <span class="fumetto" id="aiuto-testo" role="tooltip"><b>1.</b> Clicca <b>Avvia cattura</b> e scegli la scheda del PACS<br><b>2.</b> Trascina un rettangolo sull'immagine<br><b>3.</b> Apri la <b>finestra fluttuante</b></span>
    </span>
  </div>
  <p id="messaggio" role="status" aria-live="polite">Caricamento del modello…</p>

  <div id="contenitore">
    <div id="vista">
      <video id="video" muted playsinline></video>
      <canvas id="tela" aria-label="Immagine RM con strutture etichettate"></canvas>
      <div id="cursore"></div>
      <button id="ingranaggio" aria-label="Opzioni" title="Opzioni" aria-expanded="false" aria-controls="opzioni">&#9881;&#xFE0E;</button>
      <div id="opzioni" hidden>
        <h2>Modello</h2>
        <div class="scelta" id="sceltaModello" role="group" aria-label="Versione del modello"></div>
        <h2>Visualizzazione</h2>
        <label class="riga">Maschera <input type="checkbox" class="switch" role="switch" id="mostraMaschere" checked></label>
        <label class="riga">Etichette <input type="checkbox" class="switch" role="switch" id="mostraEtichette" checked></label>
        <div class="riga">Grandezza testo
          <span class="passo"><button id="fontMeno" aria-label="Riduci il testo">−</button><output id="fontValore">12</output><button id="fontPiu" aria-label="Ingrandisci il testo">+</button></span>
        </div>
        <h2>Nascondi elementi</h2>
        <div id="listaGruppi"></div>
      </div>
      <div class="barra">
        <button id="pausa" disabled>Pausa</button>
        <label>Opacità <input type="range" id="opacita" min="0" max="90" value="40"></label>
        <label title="Nasconde le zone in cui il modello è poco sicuro">Confidenza min. <input type="range" id="soglia" min="0" max="95" value="50"></label>
        <span id="stato">—</span>
      </div>
    </div>
  </div>

</main>

<script>
// ---------------- Configurazione ----------------
const LATO = 256, N = LATO * LATO;
// Versioni del modello: la PRIMA è quella caricata all'avvio (l'ultima). Le altre si caricano solo quando vengono scelte.
const MODELLI = [
  { id: 'v2', nome: 'v2', descr: 'T1, T2 e FLAIR', file: 'modelli/v2/modello_int8.onnx', config: 'modelli/v2/config_app.json' },
  { id: 'v1', nome: 'v1', descr: 'solo T1',        file: 'modelli/v1/modello_int8.onnx', config: 'modelli/v1/config_app.json' },
];
const SOGLIA_NERO = 8;          // pixel più scuri di così, collegati al bordo, sono sfondo
const SOGLIA_CAMBIO = 1.5;      // differenza media (0-255) sulla miniatura per rianalizzare
const AREA_MIN_ETICHETTA = 30;  // pixel (a 256x256) sotto cui un blocco non riceve la scritta
let CLASSI_BASE, CLASSI = ["sfondo", "sostanza bianca cerebrale", "ventricolo laterale", "corno temporale del ventricolo laterale",
  "terzo ventricolo", "quarto ventricolo", "plesso corioideo", "talamo", "nucleo caudato", "putamen", "globo pallido",
  "ippocampo", "amigdala", "nucleo accumbens", "diencefalo ventrale", "tronco encefalico", "corteccia cerebellare",
  "sostanza bianca cerebellare", "chiasma ottico", "corteccia cerebrale non classificata",
  "banca del solco temporale superiore", "cingolo anteriore caudale", "giro frontale medio caudale", "cuneo",
  "corteccia entorinale", "giro fusiforme", "lobulo parietale inferiore", "giro temporale inferiore", "istmo del cingolo",
  "corteccia occipitale laterale", "corteccia orbitofrontale laterale", "giro linguale", "corteccia orbitofrontale mediale",
  "giro temporale medio", "giro paraippocampale", "lobulo paracentrale", "pars opercularis", "pars orbitalis",
  "pars triangularis", "corteccia pericalcarina", "giro postcentrale", "cingolo posteriore", "giro precentrale", "precuneo",
  "cingolo anteriore rostrale", "giro frontale medio rostrale", "giro frontale superiore", "lobulo parietale superiore",
  "giro temporale superiore", "giro sopramarginale", "polo frontale", "polo temporale", "giro temporale trasverso (Heschl)", "insula"];

// Gruppi nascondibili (per nome, così restano validi anche se config_app.json cambia l'ordine delle classi)
const GRUPPI = [
  ['Lobo frontale', ['giro frontale superiore', 'giro frontale medio rostrale', 'giro frontale medio caudale', 'pars opercularis',
    'pars triangularis', 'pars orbitalis', 'corteccia orbitofrontale laterale', 'corteccia orbitofrontale mediale',
    'giro precentrale', 'lobulo paracentrale', 'polo frontale']],
  ['Lobo parietale', ['giro postcentrale', 'lobulo parietale superiore', 'lobulo parietale inferiore', 'giro sopramarginale', 'precuneo']],
  ['Lobo temporale', ['giro temporale superiore', 'giro temporale medio', 'giro temporale inferiore', 'banca del solco temporale superiore',
    'giro temporale trasverso (Heschl)', 'giro fusiforme', 'corteccia entorinale', 'giro paraippocampale', 'polo temporale']],
  ['Lobo occipitale', ['corteccia occipitale laterale', 'cuneo', 'giro linguale', 'corteccia pericalcarina']],
  ['Cingolo', ['cingolo anteriore rostrale', 'cingolo anteriore caudale', 'cingolo posteriore', 'istmo del cingolo']],
  ['Insula e altra corteccia', ['insula', 'insula (o corteccia non classificata)', 'corteccia cerebrale non classificata']],
  ['Sostanza bianca', ['sostanza bianca cerebrale']],
  ['Gangli della base', ['nucleo caudato', 'putamen', 'globo pallido', 'nucleo accumbens']],
  ['Talamo e diencefalo', ['talamo', 'diencefalo ventrale', 'chiasma ottico']],
  ['Ippocampo e amigdala', ['ippocampo', 'amigdala']],
  ['Ventricoli', ['ventricolo laterale', 'corno temporale del ventricolo laterale', 'terzo ventricolo', 'quarto ventricolo', 'plesso corioideo']],
  ['Tronco e cervelletto', ['tronco encefalico', 'corteccia cerebellare', 'sostanza bianca cerebellare']],
];

// ---------------- Stato ----------------
// gli elementi della vista si spostano nella finestra fluttuante: vanno cercati anche lì
const $ = id => document.getElementById(id) || (pipWin && pipWin.document.getElementById(id));
const video = $('video'), tela = $('tela'), vista = $('vista');
const sessioni = new Map();      // modelli già caricati: il ritorno a una versione già usata è immediato
let modelloAttivo = null, caricandoModello = false, ortPronto = false;
let sessione = null, stream = null, riquadro = null, pipWin = null;
let inCorso = false, inPausa = false, selezionando = false, trascina = null;
let ultimaMiniatura = null, risultato = null, colori = [];
const lavoro = document.createElement('canvas'); lavoro.width = lavoro.height = LATO;
const ctxLavoro = lavoro.getContext('2d', { willReadFrequently: true });
const mini = document.createElement('canvas'); mini.width = mini.height = 48;
const ctxMini = mini.getContext('2d', { willReadFrequently: true });
const fotogramma = document.createElement('canvas');
const sovrapposizione = document.createElement('canvas'); sovrapposizione.width = sovrapposizione.height = LATO;

const messaggio = (t, errore = false) => { $('messaggio').textContent = t; $('messaggio').className = errore ? 'errore' : ''; };
const stato = html => { $('stato').innerHTML = html; };
// opzioni del pannello (ricordate nel browser)
const salvate = (() => { try { return JSON.parse(localStorage.getItem('annotatore-opzioni')) || {}; } catch { return {}; } })();
let dimFont = salvate.dimFont || 12, visibile = null, versioneFiltro = 0;
// strutture nascoste, per nome (valgono per tutti i modelli). Le vecchie preferenze per gruppo vengono convertite.
const nascoste = new Set(salvate.nascoste || GRUPPI.filter(([g]) => (salvate.gruppiNascosti || []).includes(g)).flatMap(([, st]) => st));
nascoste.add('sostanza bianca cerebrale');   // spenta a ogni avvio; si riaccende dal suo interruttore
const aperti = new Set();         // gruppi espansi nel pannello
function salvaOpzioni() {
  try { localStorage.setItem('annotatore-opzioni', JSON.stringify({ dimFont, nascoste: [...nascoste],
                                                                     maschere: $('mostraMaschere').checked,
                                                                     etichette: $('mostraEtichette').checked })); } catch {}
}
function aggiornaVisibili() {
  visibile = new Uint8Array(CLASSI.length).fill(1);
  CLASSI.forEach((nome, c) => { if (c > 0 && nascoste.has(nome)) visibile[c] = 0; });
  versioneFiltro++;
}
function gruppiPresenti() {      // gruppi con le sole strutture del modello attivo; le strutture non previste finiscono in "Altro"
  const usate = new Set(), out = [];
  for (const [nome, st] of GRUPPI) {
    const p = [...new Set(st.filter(x => CLASSI.includes(x)))]; p.forEach(x => usate.add(x));
    if (p.length) out.push([nome, p]);
  }
  const altro = [...new Set(CLASSI.slice(1).filter(x => !usate.has(x)))];
  if (altro.length) out.push(['Altro', altro]);
  return out;
}
function interruttore(attr, valore) {
  const sw = document.createElement('input'); sw.type = 'checkbox'; sw.className = 'switch';
  sw.setAttribute('role', 'switch'); sw.dataset[attr] = valore; return sw;
}
function costruisciOpzioni() {
  const lista = $('listaGruppi'); lista.textContent = '';
  const tutti = document.createElement('label'); tutti.className = 'riga riga-tutti';
  tutti.append('Seleziona tutti', interruttore('tutti', '1')); lista.append(tutti);
  for (const [nome, st] of gruppiPresenti()) {
    const blocco = document.createElement('div'), riga = document.createElement('div'); riga.className = 'gruppo-riga';
    let figli = null;
    if (st.length > 1) {
      const fr = document.createElement('button'); fr.type = 'button'; fr.className = 'freccia'; fr.textContent = '▶';
      fr.dataset.apri = nome; fr.setAttribute('aria-expanded', aperti.has(nome)); fr.setAttribute('aria-label', 'Mostra le strutture di ' + nome);
      riga.append(fr);
      figli = document.createElement('div'); figli.className = 'figli'; figli.hidden = !aperti.has(nome);
      for (const x of st) {
        const r = document.createElement('label'); r.className = 'riga';
        const t = document.createElement('span'); t.textContent = x;
        r.append(t, interruttore('struttura', x)); figli.append(r);
      }
    } else { const sp = document.createElement('span'); sp.className = 'spazio-freccia'; riga.append(sp); }
    const lab = document.createElement('label'); lab.className = 'riga'; lab.title = st.join(', ');
    const testo = document.createElement('span'); testo.append(nome + ' ');
    const n = document.createElement('small'); n.textContent = st.length; testo.append(n);
    lab.append(testo, interruttore('gruppo', nome)); riga.append(lab); blocco.append(riga);
    if (figli) blocco.append(figli);
    lista.append(blocco);
  }
  $('fontValore').textContent = dimFont;
  aggiornaInterruttori(); aggiornaVisibili();
}
function aggiornaInterruttori() {        // acceso = tutto visibile, spento = tutto nascosto, a metà = in parte
  const gp = gruppiPresenti(), stato = elenco => {
    const n = elenco.filter(x => nascoste.has(x)).length; return { checked: n === 0, indeterminate: n > 0 && n < elenco.length };
  };
  for (const sw of $('listaGruppi').querySelectorAll('input.switch')) {
    const el = sw.dataset.tutti ? gp.flatMap(([, st]) => st) : sw.dataset.gruppo ? (gp.find(([g]) => g === sw.dataset.gruppo) || [, []])[1] : [sw.dataset.struttura];
    Object.assign(sw, stato(el));
  }
}
function mostraOpzioni(si) { $('opzioni').hidden = !si; $('ingranaggio').setAttribute('aria-expanded', si); }
const aspetta = ms => new Promise(r => (pipWin || window).setTimeout(r, ms));   // i timer della finestra visibile non vengono rallentati

function preparaColori() {
  colori = CLASSI.map((_, c) => {
    if (c === 0) return [0, 0, 0];
    const h = (c * 137.508) % 360, s = .72, l = c < 20 ? .52 : .58;       // angolo aureo: colori ben distinti
    const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [f(0) * 255, f(8) * 255, f(4) * 255].map(Math.round);
  });
}

// ---------------- Modello ----------------
function avviso(t, errore = false) { messaggio(t, errore); if (pipWin || stream) stato(errore ? 'errore modello' : t); }

function aggiornaScelta() {
  const box = $('sceltaModello'); box.textContent = '';
  for (const m of MODELLI) {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.modello = m.id;
    b.setAttribute('aria-pressed', modelloAttivo && modelloAttivo.id === m.id ? 'true' : 'false');
    b.disabled = caricandoModello;
    const d = document.createElement('small'); d.textContent = m.descr;
    b.append(m.nome, d); box.append(b);
  }
}

async function preparaOrt() {
  if (ortPronto) return;
  ort.env.wasm.wasmPaths = new URL('ort/', location.href).href;
  ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 1) : 1;
  const w = await fetch('ort/ort-wasm-simd-threaded.wasm');
  ort.env.wasm.wasmBinary = new Uint8Array(await w.arrayBuffer());
  ortPronto = true;
}

async function scarica(url, avanzamento) {   // file intero, oppure diviso in parti .part0, .part1, … (limite di GitHub)
  let r = await fetch(url), parti = [r];
  if (!r.ok) {
    parti = [];
    for (let i = 0; ; i++) { const p = await fetch(`${url.replace(/\.onnx$/, '')}.part${i}`); if (!p.ok) break; parti.push(p); }
    if (!parti.length) throw new Error(`file non trovato (${url}, HTTP ${r.status})`);
  }
  const totale = parti.reduce((t, p) => t + (+p.headers.get('content-length') || 0), 0), pezzi = [];
  let letti = 0;
  for (const p of parti) {
    const lettore = p.body.getReader();
    for (;;) {
      const { done, value } = await lettore.read(); if (done) break;
      pezzi.push(value); letti += value.length;
      if (totale) avanzamento(Math.min(100, Math.round(letti / totale * 100)));
    }
  }
  const byte = new Uint8Array(letti); let o = 0; for (const q of pezzi) { byte.set(q, o); o += q.length; }
  return byte;
}

async function usaModello(id) {
  const m = MODELLI.find(x => x.id === id);
  if (!m || caricandoModello || (modelloAttivo === m && sessione)) return false;
  caricandoModello = true; aggiornaScelta();
  try {
    await preparaOrt();
    let voce = sessioni.get(id);
    if (!voce) {
      let classi = CLASSI_BASE;
      try { const c = await (await fetch(m.config)).json(); if (Array.isArray(c.classi)) classi = c.classi; } catch {}
      const byte = await scarica(m.file, p => avviso(`Caricamento del modello ${m.nome}… ${p} %`));
      voce = { classi, sess: await ort.InferenceSession.create(byte, { executionProviders: ['wasm'], graphOptimizationLevel: 'all' }) };
      sessioni.set(id, voce);
    }
    while (inCorso) await aspetta(50);                  // non cambiare modello a metà di un'analisi
    sessione = voce.sess; CLASSI = voce.classi; modelloAttivo = m;
    preparaColori(); costruisciOpzioni();
    avviso(`Modello ${m.nome} (${m.descr}) pronto, ${ort.env.wasm.numThreads} thread.` + (stream ? '' : ' Clicca "Avvia cattura".'));
    if (!stream) $('avvia').disabled = false;
    if (riquadro && stream && video.videoWidth) {        // rianalisi immediata della slice corrente, anche in pausa
      ultimaMiniatura = null;
      if (inPausa) analizza().catch(e => messaggio('Errore di analisi: ' + (e.message || e), true));
    }
    return true;
  } catch (e) {
    avviso(`Modello ${m.nome} non disponibile: ${e.message || e}` + (modelloAttivo ? `. Resta attivo ${modelloAttivo.nome}.` : ''), true);
    return false;
  } finally { caricandoModello = false; aggiornaScelta(); }
}

async function caricaModello() {                        // all'avvio: l'ultima versione; se manca, la precedente
  const mancanti = [];
  for (const m of MODELLI) {
    if (await usaModello(m.id)) {
      if (mancanti.length) messaggio($('messaggio').textContent + ` (${mancanti.join(', ')} non trovato in ${MODELLI[0].file.replace(/[^/]+$/, '')}: controlla il caricamento su GitHub)`, true);
      return;
    }
    mancanti.push(m.nome);
  }
}

// ---------------- Cattura ----------------
function evidenzia(id) {                   // giallo = passo successivo, verde = passi già riusciti
  const passi = ['avvia', 'seleziona', 'pip'], k = id ? passi.indexOf(id) : passi.length;
  passi.forEach((b, i) => { const el = document.getElementById(b);
    el.classList.toggle('primario', i === k); el.classList.toggle('fatto', i < k); });
}
async function avvia() {
  try {
    const opzioni = { video: { displaySurface: 'browser', frameRate: 5 }, audio: false,
                      selfBrowserSurface: 'exclude', surfaceSwitching: 'include' };
    let controller = null;
    if ('CaptureController' in window) { controller = new CaptureController(); opzioni.controller = controller; }
    stream = await navigator.mediaDevices.getDisplayMedia(opzioni);
    try { controller && controller.setFocusBehavior && controller.setFocusBehavior('no-focus-change'); } catch {}
    video.srcObject = stream; await video.play();
    stream.getVideoTracks()[0].addEventListener('ended', ferma);
    $('seleziona').disabled = false; $('pausa').disabled = false;
    evidenzia('seleziona');
    iniziaSelezione();
    ciclo();
  } catch (e) { messaggio('Cattura non avviata: ' + (e.message || e), true); }
}
function ferma() {
  stream = null; riquadro = null; risultato = null; selezionando = false;
  $('seleziona').disabled = $('pip').disabled = $('pausa').disabled = true;
  evidenzia('avvia');
  messaggio('Condivisione terminata. Clicca "Avvia cattura" per ricominciare.'); disegna();
}

// ---------------- Selezione del riquadro ----------------
function areaVideo() {                     // dove appare il video intero dentro la tela (in pixel CSS)
  const W = tela.clientWidth, H = tela.clientHeight, s = Math.min(W / video.videoWidth, H / video.videoHeight);
  return { x: (W - video.videoWidth * s) / 2, y: (H - video.videoHeight * s) / 2, s };
}
function iniziaSelezione() {
  selezionando = true; trascina = null;
  messaggio('Trascina un rettangolo sull\'immagine RM (senza menu né scritte).');
  const anima = () => { if (!selezionando) return; disegnaSelezione(); requestAnimationFrame(anima); };
  anima();
}
function disegnaSelezione() {
  const ctx = preparaTela(); if (!ctx || !video.videoWidth) return;
  const a = areaVideo();
  ctx.drawImage(video, a.x, a.y, video.videoWidth * a.s, video.videoHeight * a.s);
  if (trascina) {
    const x = Math.min(trascina.x0, trascina.x1), y = Math.min(trascina.y0, trascina.y1);
    const w = Math.abs(trascina.x1 - trascina.x0), h = Math.abs(trascina.y1 - trascina.y0);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, tela.clientWidth, tela.clientHeight);
    ctx.drawImage(video, (x - a.x) / a.s, (y - a.y) / a.s, w / a.s, h / a.s, x, y, w, h);
    ctx.strokeStyle = '#E0A526'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);

}
function posizione(ev) { const r = tela.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
tela.addEventListener('pointerdown', ev => {
  mostraOpzioni(false);
  if (!selezionando) return;
  const p = posizione(ev); trascina = { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; tela.setPointerCapture(ev.pointerId);
});
tela.addEventListener('pointermove', ev => {
  const p = posizione(ev);
  if (selezionando) { if (trascina) { trascina.x1 = p.x; trascina.y1 = p.y; } return; }
  aggiornaHover(p);
});
tela.addEventListener('pointerleave', () => { $('cursore').style.display = 'none'; if (evidenziato) { evidenziato = null; disegna(); } });
tela.addEventListener('pointerup', () => {
  if (!selezionando || !trascina) return;
  const a = areaVideo();
  const x = (Math.min(trascina.x0, trascina.x1) - a.x) / a.s, y = (Math.min(trascina.y0, trascina.y1) - a.y) / a.s;
  const w = Math.abs(trascina.x1 - trascina.x0) / a.s, h = Math.abs(trascina.y1 - trascina.y0) / a.s;
  trascina = null;
  if (w < 64 || h < 64) { messaggio('Riquadro troppo piccolo: riprova trascinando un rettangolo più grande.', true); return; }
  riquadro = {
    x: Math.max(0, Math.round(x)), y: Math.max(0, Math.round(y)),
    w: Math.round(Math.min(w, video.videoWidth - x)), h: Math.round(Math.min(h, video.videoHeight - y)) };
  selezionando = false; ultimaMiniatura = null;
  $('pip').disabled = false; evidenzia(pipWin ? null : 'pip');
  messaggio('Riquadro impostato. Apri la finestra fluttuante e torna al PACS.');
});

// ---------------- Ciclo di analisi ----------------
async function ciclo() {
  while (stream) {
    if (!inPausa && riquadro && sessione && !inCorso && video.videoWidth) {
      const m = miniatura();
      if (!ultimaMiniatura || differenza(m, ultimaMiniatura) > SOGLIA_CAMBIO) {
        ultimaMiniatura = m;
        try { await analizza(); } catch (e) { messaggio('Errore di analisi: ' + (e.message || e), true); }
      }
    }
    await aspetta(400);
  }
}
function miniatura() {
  ctxMini.drawImage(video, riquadro.x, riquadro.y, riquadro.w, riquadro.h, 0, 0, 48, 48);
  const d = ctxMini.getImageData(0, 0, 48, 48).data, g = new Uint8Array(48 * 48);
  for (let i = 0; i < g.length; i++) g[i] = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3;
  return g;
}
function differenza(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; }

async function analizza() {
  inCorso = true; stato('analisi in corso…');
  const r = riquadro, s = LATO / Math.max(r.w, r.h);
  const geo = { dw: Math.round(r.w * s), dh: Math.round(r.h * s) };
  geo.dx = Math.floor((LATO - geo.dw) / 2); geo.dy = Math.floor((LATO - geo.dh) / 2);
  // immagine per la rete: riquadro adattato a 256x256 senza deformare, bordi neri
  ctxLavoro.fillStyle = '#000'; ctxLavoro.fillRect(0, 0, LATO, LATO);
  ctxLavoro.drawImage(video, r.x, r.y, r.w, r.h, geo.dx, geo.dy, geo.dw, geo.dh);
  // immagine da mostrare: il riquadro alla sua risoluzione (max 1024 px)
  const k = Math.min(1, 1024 / Math.max(r.w, r.h));
  fotogramma.width = Math.round(r.w * k); fotogramma.height = Math.round(r.h * k);
  fotogramma.getContext('2d').drawImage(video, r.x, r.y, r.w, r.h, 0, 0, fotogramma.width, fotogramma.height);

  const px = ctxLavoro.getImageData(0, 0, LATO, LATO).data, grigio = new Uint8Array(N);
  for (let i = 0; i < N; i++) grigio[i] = 0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2];
  const prep = prepara(grigio);
  if (!prep) { risultato = null; inCorso = false; stato('nessuna immagine nel riquadro'); disegna(); return; }

  const t = performance.now();
  const out = await sessione.run({ input: new ort.Tensor('float32', prep.input, [1, 1, LATO, LATO]) });
  const ms = performance.now() - t;
  risultato = { classe: out.classe.data, conf: out.confidenza.data, geo, centro: prep.centro };
  inCorso = false;
  stato(`<span class="ok">●</span> ${modelloAttivo ? modelloAttivo.nome + ' ' : ''}${Math.round(ms)} ms`);
  disegna();
}

// Z-score sui pixel della testa (sfondo nero collegato al bordo escluso), come in addestramento
function prepara(g) {
  const sfondo = new Uint8Array(N), coda = new Int32Array(N); let t = 0, h = 0;
  const aggiungi = i => { if (!sfondo[i] && g[i] <= SOGLIA_NERO) { sfondo[i] = 1; coda[t++] = i; } };
  for (let x = 0; x < LATO; x++) { aggiungi(x); aggiungi((LATO - 1) * LATO + x); }
  for (let y = 0; y < LATO; y++) { aggiungi(y * LATO); aggiungi(y * LATO + LATO - 1); }
  while (h < t) {
    const i = coda[h++], x = i % LATO, y = (i / LATO) | 0;
    if (x > 0) aggiungi(i - 1); if (x < LATO - 1) aggiungi(i + 1);
    if (y > 0) aggiungi(i - LATO); if (y < LATO - 1) aggiungi(i + LATO);
  }
  let s = 0, s2 = 0, n = 0;
  for (let i = 0; i < N; i++) if (!sfondo[i]) { s += g[i]; s2 += g[i] * g[i]; n++; }
  if (n < 500) return null;
  const media = s / n, dev = Math.max(Math.sqrt(Math.max(s2 / n - media * media, 0)), 1e-8);
  const out = new Float32Array(N); let sx = 0;
  for (let i = 0; i < N; i++) { out[i] = sfondo[i] ? 0 : (g[i] - media) / dev; if (!sfondo[i]) sx += i % LATO; }
  return { input: out, centro: sx / n };
}

// ---------------- Blocchi, gruppi ed etichette esterne ----------------
let analisi = null;          // cache: mappa filtrata, componenti, gruppi (ricalcolata solo se cambia risultato o soglia)
let impaginato = null;       // posizioni sullo schermo di immagine ed etichette (per l'hover)
let evidenziato = null;      // chiave del gruppo sotto il mouse

function calcolaAnalisi() {
  const soglia = +$('soglia').value / 100;
  if (analisi && analisi.risultato === risultato && analisi.soglia === soglia && analisi.filtro === versioneFiltro) return analisi;
  const L = new Uint8Array(N);
  for (let i = 0; i < N; i++) L[i] = risultato.conf[i] >= soglia && visibile[risultato.classe[i]] ? risultato.classe[i] : 0;
  // distanza dal bordo del proprio blocco (per ancorare la linea nel punto più interno)
  const d = new Float32Array(N), INF = 1e9;
  for (let i = 0; i < N; i++) {
    if (!L[i]) continue;
    const x = i % LATO, y = (i / LATO) | 0;
    d[i] = (x === 0 || y === 0 || x === LATO - 1 || y === LATO - 1 || L[i - 1] !== L[i] || L[i + 1] !== L[i] ||
            L[i - LATO] !== L[i] || L[i + LATO] !== L[i]) ? 1 : INF;
  }
  for (let y = 1; y < LATO; y++) for (let x = 1; x < LATO - 1; x++) {
    const i = y * LATO + x; if (!L[i] || d[i] === 1) continue;
    if (L[i - 1] === L[i]) d[i] = Math.min(d[i], d[i - 1] + 1);
    if (L[i - LATO] === L[i]) d[i] = Math.min(d[i], d[i - LATO] + 1);
    if (L[i - LATO - 1] === L[i]) d[i] = Math.min(d[i], d[i - LATO - 1] + 1.41);
    if (L[i - LATO + 1] === L[i]) d[i] = Math.min(d[i], d[i - LATO + 1] + 1.41);
  }
  for (let y = LATO - 2; y >= 0; y--) for (let x = LATO - 2; x > 0; x--) {
    const i = y * LATO + x; if (!L[i] || d[i] === 1) continue;
    if (L[i + 1] === L[i]) d[i] = Math.min(d[i], d[i + 1] + 1);
    if (L[i + LATO] === L[i]) d[i] = Math.min(d[i], d[i + LATO] + 1);
    if (L[i + LATO + 1] === L[i]) d[i] = Math.min(d[i], d[i + LATO + 1] + 1.41);
    if (L[i + LATO - 1] === L[i]) d[i] = Math.min(d[i], d[i + LATO - 1] + 1.41);
  }
  // componenti connesse (4-connessione) → gruppi "struttura + lato dell'immagine"
  const comp = new Int32Array(N).fill(-1), coda = new Int32Array(N), gruppi = new Map(), compGruppo = [];
  let nComp = 0;
  for (let i0 = 0; i0 < N; i0++) {
    if (!L[i0] || comp[i0] >= 0) continue;
    const c = L[i0], id = nComp++; let h = 0, t = 0, area = 0, migliore = i0;
    comp[i0] = id; coda[t++] = i0;
    while (h < t) {
      const i = coda[h++]; area++;
      if (d[i] > d[migliore]) migliore = i;
      const x = i % LATO;
      for (const j of [x > 0 ? i - 1 : -1, x < LATO - 1 ? i + 1 : -1, i - LATO, i + LATO])
        if (j >= 0 && j < N && comp[j] < 0 && L[j] === c) { comp[j] = id; coda[t++] = j; }
    }
    const ax = migliore % LATO, ay = (migliore / LATO) | 0, lato = ax < risultato.centro ? 'sx' : 'dx';
    const chiave = c + '-' + lato;
    let g = gruppi.get(chiave);
    if (!g) { g = { chiave, c, lato, area: 0, maxArea: 0, ax, ay }; gruppi.set(chiave, g); }
    g.area += area;
    if (area > g.maxArea) { g.maxArea = area; g.ax = ax; g.ay = ay; }
    compGruppo[id] = chiave;
  }
  analisi = { risultato, soglia, filtro: versioneFiltro, L, comp, compGruppo,
              gruppi: [...gruppi.values()].filter(g => g.maxArea >= AREA_MIN_ETICHETTA) };
  return analisi;
}

// ---------------- Disegno ----------------
function preparaTela() {
  const W = tela.clientWidth, H = tela.clientHeight; if (!W || !H) return null;
  const dpr = (tela.ownerDocument.defaultView || window).devicePixelRatio || 1;
  if (tela.width !== Math.round(W * dpr) || tela.height !== Math.round(H * dpr)) {
    tela.width = Math.round(W * dpr); tela.height = Math.round(H * dpr);
  }
  const ctx = tela.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  return ctx;
}
function areaImmagine(margine = 0) {       // dove appare il riquadro dentro la tela, lasciando i margini per le etichette
  const W = tela.clientWidth - 2 * margine, H = tela.clientHeight;
  const s = Math.min(W / fotogramma.width, H / fotogramma.height);
  return { x: margine + (W - fotogramma.width * s) / 2, y: (H - fotogramma.height * s) / 2,
           w: fotogramma.width * s, h: fotogramma.height * s };
}
const rgba = (c, a) => `rgba(${colori[c][0]},${colori[c][1]},${colori[c][2]},${a})`;

function disegna() {
  if (selezionando) return;
  const ctx = preparaTela(); impaginato = null; if (!ctx) return;
  if (!risultato || !fotogramma.width) return;
  const conEtichette = $('mostraEtichette').checked, W = tela.clientWidth, H = tela.clientHeight;
  const dim = dimFont, riga = dim + 5;
  const A = calcolaAnalisi(), g = risultato.geo;
  ctx.font = `600 ${dim}px "Segoe UI", system-ui, sans-serif`;
  // margini laterali larghi quanto serve all'etichetta più lunga (max 30 % della larghezza)
  const piuLunga = Math.max(0, ...A.gruppi.map(gr => ctx.measureText(CLASSI[gr.c]).width));
  const margine = conEtichette ? Math.round(Math.min(W * 0.3, Math.max(90, piuLunga + 26))) : 0;
  const spazioTesto = margine - 26;
  const tronca = t => { if (ctx.measureText(t).width <= spazioTesto) return t;
    while (t.length > 3 && ctx.measureText(t + '…').width > spazioTesto) t = t.slice(0, -1); return t + '…'; };
  const a = areaImmagine(margine);
  const inSchermo = (u, v) => ({ x: a.x + (u + .5 - g.dx) / g.dw * a.w, y: a.y + (v + .5 - g.dy) / g.dh * a.h });

  // immagine
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(fotogramma, a.x, a.y, a.w, a.h);

  // maschere (quelle del gruppo evidenziato più intense, le altre attenuate)
  if ($('mostraMaschere').checked || evidenziato) {
    const img = new ImageData(LATO, LATO), alfa = +$('opacita').value / 100 * 255;
    const base = $('mostraMaschere').checked ? (evidenziato ? alfa * 0.45 : alfa) : 0;
    for (let i = 0; i < N; i++) {
      const c = A.L[i]; if (!c) continue;
      const sel = evidenziato && A.compGruppo[A.comp[i]] === evidenziato;
      const col = colori[c], p = i * 4;
      if (sel) {
        const x = i % LATO, bordo = A.compGruppo[A.comp[i - 1]] !== evidenziato || A.compGruppo[A.comp[i + 1]] !== evidenziato ||
          A.compGruppo[A.comp[i - LATO]] !== evidenziato || A.compGruppo[A.comp[i + LATO]] !== evidenziato || x === 0 || x === LATO - 1;
        if (bordo) { img.data[p] = img.data[p + 1] = img.data[p + 2] = 255; img.data[p + 3] = 255; }
        else { img.data[p] = col[0]; img.data[p + 1] = col[1]; img.data[p + 2] = col[2]; img.data[p + 3] = 200; }
      } else if (base) { img.data[p] = col[0]; img.data[p + 1] = col[1]; img.data[p + 2] = col[2]; img.data[p + 3] = base; }
    }
    sovrapposizione.getContext('2d').putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sovrapposizione, g.dx, g.dy, g.dw, g.dh, a.x, a.y, a.w, a.h);
  }

  impaginato = { a, etichette: [] };
  if (!conEtichette) return;

  // etichette esterne: colonna sinistra e destra, ordinate per altezza, senza sovrapposizioni
  ctx.font = `600 ${dim}px "Segoe UI", system-ui, sans-serif`; ctx.textBaseline = 'middle';
  const capienza = Math.max(1, Math.floor((H - 8) / riga));
  for (const lato of ['sx', 'dx']) {
    let col = A.gruppi.filter(gr => gr.lato === lato);
    if (col.length > capienza) col = col.sort((p, q) => q.area - p.area).slice(0, capienza);
    col = col.map(gr => ({ gr, p: inSchermo(gr.ax, gr.ay) })).sort((p, q) => p.p.y - q.p.y);
    // posizioni verticali: vicine all'altezza della struttura, distanziate di una riga
    let y = 4 + riga / 2;
    for (const e of col) { e.y = Math.max(e.p.y, y); y = e.y + riga; }
    let limite = H - 4 - riga / 2;
    for (let k = col.length - 1; k >= 0; k--) { col[k].y = Math.min(col[k].y, limite); limite = col[k].y - riga; }
    for (const e of col) {
      const testo = tronca(CLASSI[e.gr.c]), w = ctx.measureText(testo).width;
      const xTesto = lato === 'sx' ? margine - 10 - w : W - margine + 10, xLinea = lato === 'sx' ? margine - 6 : W - margine + 6;
      impaginato.etichette.push({ chiave: e.gr.chiave, x: xTesto - 4, y: e.y - riga / 2, w: w + 8, h: riga,
                                  testo, c: e.gr.c, xTesto, xLinea, p: e.p, ye: e.y, lato, larg: w });
    }
  }
  // prima le linee e le etichette normali, poi quella evidenziata sopra a tutte
  const ordine = [...impaginato.etichette].sort((p, q) => (p.chiave === evidenziato) - (q.chiave === evidenziato));
  for (const e of ordine) {
    const sel = e.chiave === evidenziato, attenuata = evidenziato && !sel;
    ctx.globalAlpha = attenuata ? 0.45 : 1;
    ctx.strokeStyle = sel ? '#fff' : rgba(e.c, 0.9); ctx.lineWidth = sel ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(e.p.x, e.p.y); ctx.lineTo(e.xLinea, e.ye); ctx.stroke();
    ctx.fillStyle = sel ? '#fff' : rgba(e.c, 1);
    ctx.beginPath(); ctx.arc(e.p.x, e.p.y, sel ? 3.5 : 2.5, 0, 2 * Math.PI); ctx.fill();
    if (sel) { ctx.fillStyle = rgba(e.c, 1); ctx.fillRect(e.x, e.y, e.w, e.h); }
    ctx.fillStyle = sel ? '#000' : '#E8EEF1';
    ctx.fillText(e.testo, e.xTesto, e.ye + 0.5);
    if (!sel) { ctx.fillStyle = rgba(e.c, 1); ctx.fillRect(e.lato === 'sx' ? e.xTesto + e.larg + 3 : e.xTesto - 6, e.ye - 3, 3, 6); }
  }
  ctx.globalAlpha = 1;
}

// ---------------- Hover: struttura ↔ etichetta ----------------
function gruppoSotto(p) {
  if (!impaginato || !risultato) return null;
  const e = impaginato.etichette.find(e => p.x >= e.x && p.x <= e.x + e.w && p.y >= e.y && p.y <= e.y + e.h);
  if (e) return { chiave: e.chiave, i: -1 };
  const a = impaginato.a, g = risultato.geo;
  const u = Math.floor(g.dx + (p.x - a.x) / a.w * g.dw), v = Math.floor(g.dy + (p.y - a.y) / a.h * g.dh);
  if (u < g.dx || v < g.dy || u >= g.dx + g.dw || v >= g.dy + g.dh) return null;
  const A = calcolaAnalisi(), i = v * LATO + u;
  return A.L[i] ? { chiave: A.compGruppo[A.comp[i]], i } : null;
}
function aggiornaHover(p) {
  const el = $('cursore'), trovato = gruppoSotto(p), chiave = trovato ? trovato.chiave : null;
  if (chiave !== evidenziato) { evidenziato = chiave; disegna(); }
  // il riquadro in alto serve solo se la struttura non ha un'etichetta visibile
  const conEtichetta = impaginato && impaginato.etichette.some(e => e.chiave === chiave);
  if (trovato && trovato.i >= 0 && !conEtichetta) {
    el.textContent = `${CLASSI[analisi.L[trovato.i]]} · ${Math.round(risultato.conf[trovato.i] * 100)} %`; el.style.display = 'block';
  } else if (trovato && trovato.i < 0) {            // etichetta accorciata: mostra il nome completo
    const e = impaginato.etichette.find(e => e.chiave === chiave);
    if (e && e.testo.endsWith('…')) { el.textContent = CLASSI[e.c]; el.style.display = 'block'; } else el.style.display = 'none';
  } else el.style.display = 'none';
}

// ---------------- Finestra fluttuante ----------------
async function apriPiP() {
  if (!('documentPictureInPicture' in window)) { messaggio('Finestra fluttuante non supportata: affianca le finestre (Win + ← / →).', true); return; }
  if (pipWin) { pipWin.focus(); return; }
  pipWin = await documentPictureInPicture.requestWindow({ width: 560, height: 640 });
  const st = pipWin.document.createElement('style'); st.textContent = $('stili').textContent;
  pipWin.document.head.append(st); pipWin.document.title = 'Atlante RM live';
  pipWin.document.body.className = 'in-pip';
  pipWin.document.body.append(vista);
  video.play().catch(() => {});
  pipWin.addEventListener('resize', disegna);
  pipWin.addEventListener('pagehide', () => {
    $('contenitore').append(vista); pipWin = null; video.play().catch(() => {});
    evidenzia(!stream ? 'avvia' : selezionando || !riquadro ? 'seleziona' : 'pip');
    requestAnimationFrame(disegna);
  });
  evidenzia(null);
  requestAnimationFrame(disegna);
}

for (const id of ['mostraMaschere', 'mostraEtichette', 'opacita', 'soglia']) $(id).addEventListener('input', disegna);
window.addEventListener('resize', () => { if (!pipWin) disegna(); });

vista.addEventListener('keydown', ev => { if (ev.key === 'Escape') mostraOpzioni(false); });
$('mostraMaschere').addEventListener('change', salvaOpzioni);
$('mostraEtichette').addEventListener('change', salvaOpzioni);
const cambiaFont = d => { dimFont = Math.min(24, Math.max(9, dimFont + d)); $('fontValore').textContent = dimFont; salvaOpzioni(); disegna(); };
$('fontMeno').onclick = () => cambiaFont(-1);
$('fontPiu').onclick = () => cambiaFont(1);
$('listaGruppi').addEventListener('change', ev => {
  const sw = ev.target, gp = gruppiPresenti();
  const el = sw.dataset.tutti ? gp.flatMap(([, st]) => st) : sw.dataset.gruppo ? (gp.find(([g]) => g === sw.dataset.gruppo) || [, []])[1]
           : sw.dataset.struttura ? [sw.dataset.struttura] : null;
  if (!el) return;
  for (const x of el) if (sw.checked) nascoste.delete(x); else nascoste.add(x);
  aggiornaInterruttori(); aggiornaVisibili(); salvaOpzioni(); disegna();
});
$('listaGruppi').addEventListener('click', ev => {
  const fr = ev.target.closest('button.freccia'); if (!fr) return;
  const g = fr.dataset.apri, apri = !aperti.has(g);
  if (apri) aperti.add(g); else aperti.delete(g);
  fr.setAttribute('aria-expanded', apri); fr.closest('.gruppo-riga').nextElementSibling.hidden = !apri;
});
$('sceltaModello').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-modello]'); if (b) usaModello(b.dataset.modello);
});
CLASSI_BASE = CLASSI;
costruisciOpzioni(); aggiornaScelta();
if (typeof ort === 'undefined') messaggio('Libreria di calcolo non trovata: controlla la cartella ort.', true);
else if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) messaggio('Questo browser non permette la cattura dello schermo.', true);
else caricaModello();
</script>
</body>
</html>
